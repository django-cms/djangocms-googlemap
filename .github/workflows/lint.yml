name: Lint

on: [push, pull_request]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install ruff
        run: python -Im pip install --user ruff
      - name: Run ruff
        run: ruff check --output-format=github .
